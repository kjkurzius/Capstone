[project]
name = "agentstack"
version = "0.1.0"
description = "Jev-gated, Claude-powered agent fleet for a single operator"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
slack = ["slack_sdk>=3.27"]   # Socket Mode client

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
